# Словари детектора коммерческой тайны, финансовых данных и особых категорий ПДн
# (T-013a, T-019a). Читает backend/app/services/detection/dict_detector.py, без LLM.
#
# Формат — список групп:
#   id           уникальный идентификатор группы (латиница, snake_case)
#   type         TRADE_SECRET | FINANCIAL | SPECIAL_CATEGORY
#   patterns     регулярные выражения по основам слов; регистр не важен, «ё» = «е»;
#                пробел в шаблоне совпадает с любым количеством пробельных символов
#   needs_value  true — сущность только если рядом есть сумма или процент
#                (в той же фразе: до 80 символов после слова или до 40 — перед ним);
#                false — отрезок от слова до конца фразы (до «.», «;», перевода строки,
#                не длиннее 120 символов). Для КТ — только если во фразе есть содержание
#                (число, скобки, «: …»); для SPECIAL_CATEGORY — сразу. Метка
#                «Национальность: …» в отрезок не входит
#   confidence   необязательно; по умолчанию 0.9 (needs_value: true) и 0.75 (false)
#   context      необязательно; список шаблонов — группа срабатывает, только если хотя бы
#                один из них есть в той же строке (абзаце)
#   needs_subject необязательно, только SPECIAL_CATEGORY; true — сущность, только если рядом
#                (та же строка или ±150 символов) есть человек: PERSON или маркер
#                («работник», «кандидат», «у него», метка «Сведения о …:», «Диагноз:»)
#   description  необязательно; комментарий для людей
#
# Шаблоны пишите в одинарных кавычках: '\w*' внутри них не нужно экранировать.
# Расчётные счета организаций ищутся кодом (проверка ключа по БИК), не словарём.

# ---------- Коммерческая тайна: слово + значение ----------
- id: cost_price
  type: TRADE_SECRET
  needs_value: true
  description: Себестоимость
  patterns:
    - 'себестоимост\w*'

- id: margin
  type: TRADE_SECRET
  needs_value: true
  description: Маржа и маржинальность
  patterns:
    - 'марж\w*'
    - 'маржинальност\w*'

- id: markup
  type: TRADE_SECRET
  needs_value: true
  description: Наценка, торговая надбавка
  patterns:
    - 'наценк\w*'
    - 'торгов\w+ надбавк\w*'

- id: profitability
  type: TRADE_SECRET
  needs_value: true
  patterns:
    - 'рентабельност\w*'

- id: purchase_price
  type: TRADE_SECRET
  needs_value: true
  description: Закупочная (входная) цена поставщика
  patterns:
    - 'закупочн\w+ цен\w*'
    - 'входн\w+ цен\w*'
    - 'цен\w* закупки'

- id: discounts
  type: TRADE_SECRET
  needs_value: true
  description: Индивидуальные скидки, бонусы, ретро-бонусы
  patterns:
    - '(?:индивидуальн|дилерск|специальн)\w* скидк\w*'
    - 'ретро-?бонус\w*'
    - 'бонус\w* поставщик\w*'
    - 'услови\w+ скидок'

- id: min_price
  type: TRADE_SECRET
  needs_value: true
  description: Минимальная цена, ниже которой поставщик не опускается на торгах (T-019a)
  patterns:
    - 'минимальн\w+ цен\w*(?! (?:контракта|договора))'
    - 'нижн\w+ границ\w* цен\w*'
    - 'цен\w*, ниже котор\w+'

- id: cost_items
  type: TRADE_SECRET
  needs_value: true
  confidence: 0.92
  description: >-
    Статьи калькуляции рядом с «себестоимостью» или «калькуляцией» (T-019a).
    Уверенность выше, чем у payroll: «ФОТ 480 000 руб.» в калькуляции — КТ, а не FINANCIAL.
  context:
    - 'себестоимост\w*'
    - 'калькуляци\w*'
  patterns:
    - 'материал\w*'
    - 'комплектующ\w*'
    - 'ФОТ'
    - 'фонд\w* оплаты труда'
    - 'накладн\w+ расход\w*'
    - 'транспорт\w*(?: расход\w*)?'
    - 'логистик\w*'
    - 'амортизаци\w*'

# ---------- Коммерческая тайна: само слово ----------
- id: know_how
  type: TRADE_SECRET
  needs_value: false
  description: Ноу-хау, рецептуры, технологии производства
  patterns:
    - 'ноу-?хау'
    - 'рецептур\w*'
    - 'технологи\w+ производства'
    - 'секрет\w* производства'

- id: client_base
  type: TRADE_SECRET
  needs_value: false
  description: Перечни клиентов и поставщиков, клиентская база
  patterns:
    - 'перечень (?:клиентов|поставщиков|контрагентов)'
    - 'клиентск\w+ баз\w*'

# ---------- Финансовые данные: слово + значение ----------
- id: revenue_profit
  type: FINANCIAL
  needs_value: true
  description: Выручка, прибыль, убыток, оборот, EBITDA
  patterns:
    - 'выручк\w*'
    - '(?:чист\w+ )?прибыл\w*'
    - 'убыт\w*'
    - 'оборот\w*'
    - 'EBITDA'

- id: receivables_payables
  type: FINANCIAL
  needs_value: true
  description: Дебиторская и кредиторская задолженность
  patterns:
    - 'дебиторск\w+ задолженност\w*'
    - 'кредиторск\w+ задолженност\w*'

- id: cash_balance
  type: FINANCIAL
  needs_value: true
  description: Остатки денежных средств
  patterns:
    - 'остат\w+ (?:денежных средств|на счет\w*)'

- id: payroll
  type: FINANCIAL
  needs_value: true
  description: Фонд оплаты труда, зарплаты, оклады
  patterns:
    - 'фонд\w* оплаты труда'
    - 'ФОТ'
    - 'заработн\w+ плат\w*'
    - 'оклад\w*'

# ---------- Особые категории ПДн (ст. 10 152-ФЗ), T-019a ----------
# Категория pd_special: значение маскируется как ПДн. Отрезок — до конца фразы.
# Ловушки (НЕ сущность): «медицинское оборудование», «медицинская организация»,
# «охрана здоровья работников», «национальный проект», «политика обработки ПДн»,
# требование «отсутствие судимости» (исключается кодом).
- id: special_health_explicit
  type: SPECIAL_CATEGORY
  needs_value: false
  confidence: 0.85
  description: >-
    Явно персональные формулировки о здоровье — сразу, без проверки субъекта:
    «инвалид II группы», «группа инвалидности», «состоит на учёте», «имеет диагноз»
  patterns:
    - 'инвалид\w* [IVX1-3]+ групп\w*'
    - 'групп\w* инвалидности'
    - 'состо\w+ на (?:диспансерн\w+ |медицинск\w+ |наркологическ\w+ |психиатрическ\w+ )?уч[её]те(?! в налогов)'
    - 'имеет (?:диагноз|заболевани|инвалидност)\w*'

- id: special_health
  type: SPECIAL_CATEGORY
  needs_value: false
  needs_subject: true
  confidence: 0.8
  description: >-
    Общие слова о здоровье — только рядом с человеком (PERSON, «работник», «кандидат»,
    метка «Диагноз:»): «препараты для лечения онкологических заболеваний» — не ПДн
  patterns:
    - 'состояни\w* здоровья'
    - 'инвалидност\w*'
    - 'диагноз\w*'
    - 'медицинск\w+ (?:показани|противопоказани)\w*'
    - 'противопоказан[аоы]?'
    - '(?:хроническ|онкологическ|психическ|профессиональн)\w* заболевани\w*'
    - 'заболевани\w* (?:по|в связи)'
    - 'беременн\w*'
    - 'ограничени\w* по (?:зрению|слуху|здоровью|состоянию здоровья)'

- id: special_criminal
  type: SPECIAL_CATEGORY
  needs_value: false
  confidence: 0.8
  description: Судимость, привлечение к уголовной ответственности
  patterns:
    - 'судим\w*'
    - 'привлекал\w* к уголовной ответственности'

- id: special_membership_explicit
  type: SPECIAL_CATEGORY
  needs_value: false
  confidence: 0.85
  description: >-
    Членство в профсоюзе или партии в единственном числе — явная персональная формулировка
    (как «инвалид II группы»), без проверки субъекта: «член профсоюза», «является членом
    партии», «членство в профсоюзе», «состоит в профсоюзе». Множественное число («для членов
    профсоюза») и организации («профсоюзная организация») — общие слова, см. special_beliefs
  patterns:
    - 'член(?:ом|у|а)? (?:профсоюз\w*|профессиональн\w+ союз\w*|парти\w*|политическ\w+ парти\w*)'
    - 'членств\w* (?:в )?(?:профсоюз\w*|профессиональн\w+ союз\w*|парти\w*|политическ\w+ парти\w*)'
    - 'состо\w+ в (?:профсоюзе|партии|политической партии)'

- id: special_beliefs
  type: SPECIAL_CATEGORY
  needs_value: false
  needs_subject: true
  confidence: 0.8
  description: >-
    Религиозные и политические убеждения; членство во множественном числе
    («членов профсоюза») — только рядом с человеком
  patterns:
    - '(?:религиозн|политическ|философск)\w+ (?:убеждени|взгляд)\w*'
    - 'вероисповедани\w*'
    - 'член\w* (?:в )?(?:профсоюз\w*|профессиональн\w+ союз\w*|парти\w*|политическ\w+ парти\w*)'

- id: special_origin
  type: SPECIAL_CATEGORY
  needs_value: false
  needs_subject: true
  confidence: 0.8
  description: Национальная и расовая принадлежность
  patterns:
    - 'национальност\w*'
    - '(?:национальн|расов|этническ)\w* принадлежност\w*'
