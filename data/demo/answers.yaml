  overall: red
  entities: {PERSON: 1, PHONE: 1, TRADE_SECRET: 1}
  violations: [PD_IN_PUBLICATION, TRADE_SECRET_IN_PUBLICATION]

# Green: есть согласование, гриф, согласие, срок хранения и подробное поручение.
# Паспорт подписанта не создаёт нарушения при наличии необходимых маркеров.
- file: 02_contract_clean.docx
