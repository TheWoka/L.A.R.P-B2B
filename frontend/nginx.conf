server {
    listen 80;
    server_name _;

    # DNS Docker: имя api перечитывается каждые 10 с, иначе после пересоздания api nginx шлёт на старый IP (502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Совпадает с MAX_UPLOAD_MB в .env (+ запас на multipart)
    client_max_body_size 55m;

    # API: путь /api/... передаётся бэкенду без изменений
    location /api/ {
        # Переменная заставляет nginx определять адрес api через resolver при запросе, а не один раз при старте
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA: любой неизвестный путь (/reports/123) отдаёт index.html, дальше решает react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
