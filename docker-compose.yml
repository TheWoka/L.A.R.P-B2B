# Запуск: cp .env.example .env && docker-compose up --build
# Ключ "version" не указываем: он устарел и вызывает предупреждение в Compose v2.

services:
  ollama:
    image: ollama/ollama:0.13.5
    profiles: ["local-llm"]
    volumes:
      - ollama_models:/root/.ollama
    # Порт не публикуется на хост: api/worker обращаются по сети Compose.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    # Контекст модели. По умолчанию Ollama на CPU берёт 4096 токенов; если compare_models.py
    # предупреждает о max total_tokens ≥ 3686, раскомментируйте (T-029b, docs/local-llm.md).
    # environment:
    #   - OLLAMA_CONTEXT_LENGTH=8192
    # GPU NVIDIA (по умолчанию — CPU). Нужны драйвер NVIDIA и WSL2-бэкенд Docker Desktop;
    # как включить и проверить — docs/local-llm.md, раздел «Какую модель выбрать» (T-029b).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; response = urllib.request.urlopen('http://localhost:8000/api/health', timeout=4); sys.exit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      - ./data/rules:/data/rules:ro
      - ./data/legal:/data/legal:ro
      - ./data/models:/data/models:ro
      - ./eval/results:/eval/results:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Тот же Dockerfile, что у api: второй build берёт слои из кэша.
    build: ./backend
    command: celery -A app.worker.celery_app worker -B --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file: .env
    volumes:
      - uploads:/data/uploads
      - ./data/rules:/data/rules:ro
      - ./data/legal:/data/legal:ro
      - ./data/models:/data/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: .env
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=4", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:
  pgdata:
  uploads:
